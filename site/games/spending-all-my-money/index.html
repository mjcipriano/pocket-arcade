<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spending All My Money</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#262c26;background:#faf5e9;font:16px system-ui}main,header>div{max-width:780px;margin:auto;padding:14px}header{background:#163e36;color:#fff8e7}h1{font: bold clamp(24px,6vw,43px) Georgia;margin:0 0 10px}button{font:inherit;font-weight:650;border:1px solid #30554b;border-radius:8px;background:#fffdf4;color:#184035;padding:9px 12px;cursor:pointer;min-height:44px}button:active{transform:translateY(1px)}button:disabled{opacity:.6}nav,.metrics,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.metrics{justify-content:space-between;font-size:15px}nav{position:sticky;top:0;background:#faf5e9;padding:8px 0;z-index:1}nav button[aria-pressed=true],.buy{background:#195247;color:white}#notice{min-height:24px;margin:8px 0;color:#713b20}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(192px,100%),1fr));gap:12px}article{padding:14px;border:1px solid #d0c5ae;border-radius:12px;background:#fffdf7;display:grid;align-content:start;gap:8px}article h3{font: bold 21px Georgia;margin:0}.icon{font-size:36px}small{color:#536156}h2{font: bold 26px Georgia;margin:12px 0}.sale{color:#963e23;font-weight:bold}.row{padding:12px 0;border-bottom:1px dashed #b9ae99;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}#restart{margin:22px 0 10px}dialog{max-width:92vw;border:0;border-radius:12px;padding:22px}dialog::backdrop{background:#172921aa}
</style><link rel="stylesheet" href="market.css"><header><div><h1>Spending All My Money</h1><div class="metrics"><span>Wallet <b id="wallet"></b></span><span>Total Spent <b id="score"></b></span><span id="space"></span></div></div></header>
<main><div class="dock"><nav><button id="shop">Shop</button><button id="storage">Storage</button><button id="work">Work +$20</button><button id="career" aria-label="Upgrade work">Upgrade work</button><button id="sound" aria-pressed="false">Sound off</button></nav><div id="receipt" hidden><span id="notice" role="status"></span><button id="pack" hidden>View storage</button></div></div><section id="store"><h2>Today's finds</h2><div id="items"></div></section><section id="bin" hidden><h2 id="tier"></h2><div id="upgrade"></div><div id="case"><div class="handle"></div><div class="rim"><div class="case-label" id="caseLabel"></div><div id="stock"></div></div></div><h2>Collections</h2><div id="sets"></div><button id="restart">Start over</button></section></main>
<dialog id="jobDialog" aria-labelledby="jobTitle"><h2 id="jobTitle">Your workbench</h2><p id="jobInfo"></p><div id="jobs"></div><p id="jobMessage" role="status"></p><button id="promote"></button> <button id="closeJob">Close</button></dialog>
<dialog id="itemDialog" aria-labelledby="itemTitle"><span id="detailIcon"></span><h2 id="itemTitle"></h2><p id="itemInfo"></p><div class="actions"><button id="sellItem"></button><button id="tossItem">Toss</button><button id="keepItem">Keep</button></div></dialog>
<dialog id="confirm"><p>Start over with $80 and an empty suitcase?</p><button id="cancel">Keep playing</button> <button id="reset">Start over</button></dialog>
<script>
const rows = [
['🔦','Flashlight',16],['🪑','Folding chair',32,2],['🧊','Picnic cooler',48,2],
['☕','Coffee mug',12],['🫘','Coffee beans',18],['🫖','Gooseneck kettle',42,2],
['🧤','Garden gloves',14],['🪴','Basil plant',20],['🚿','Watering can',24],
['🎧','Headphones',56],['📻','Pocket radio',36],['🎙️','Microphone',44],
['🎲','Dice set',8],['🃏','Playing cards',10],['♟️','Chess set',28,2],
['🖌️','Paintbrush kit',16],['🎨','Watercolors',26],['📓','Sketchbook',12],
['🍳','Cast iron skillet',50,2],['🧂','Pepper mill',22],['🥄','Wooden spoons',10],
['🕶️','Sunglasses',18],['🏖️','Beach umbrella',60,2],['🩴','Flip-flops',14],
['🛠️','Tool kit',64,2],['📏','Tape measure',12],['🔩','Jar of bolts',8],
['📸','Film camera',76],['🖼️','Picture frame',14],['🎞️','Film roll',18],
['🧣','Wool scarf',24],['🧢','Ball cap',16],['🧦','Lucky socks',10],
['📚','Mystery novels',18,2],['🕯️','Reading candle',14],['💡','Desk lamp',36,2]
];
const collections=['Ready for a Camping Trip','Coffee Break','Kitchen Garden','Radio Hour','Game Night','Art Afternoon','Sunday Supper','Beach Day','Garage Workshop','Photo Walk','Cozy Weekend','Reading Nook'];
const tiers=[['Suitcase',6],['Closet',16,100],['Garage',40,250],['Warehouse',100,600]];
const key='pocketArcade.spending.v1', $=id=>document.getElementById(id);
const jobs=[['Errand runner',20,0],['Shop assistant',35,70],['Shift lead',55,150],['Store manager',85,300],['Market director',130,600]];
const reward=g=>Math.ceil(rows.slice(g*3,g*3+3).reduce((sum,r)=>sum+r[2],0)/10)*5;
const fresh=()=>({job:0,rewarded:[],sound:false,cash:80,spent:0,tier:0,bag:[],sets:[],start:Date.now()});
let state=fresh();
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.bag)&&tiers[saved.tier])state=saved}catch{}
state.job=jobs[state.job]?state.job:0;
state.rewarded??=[];state.sound??=false;
function creditSet(g){
 if(state.rewarded.includes(g))return 0;
 const bonus=reward(g);state.cash+=bonus;state.rewarded.push(g);return bonus;
}
const backPay=state.sets.reduce((sum,g)=>sum+creditSet(g),0);
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
const size=i=>rows[i][3]||1;
const used=()=>state.bag.reduce((n,x)=>n+size(x.id),0);
function quote(i,now){const interval=45000, window=18000;
 const elapsed=Math.max(0,now-state.start);
 const phase=(elapsed+i*7919)%interval;
 const price=rows[i][2];
 return phase<window?{cost:Math.floor(price*.6),seconds:Math.ceil((window-phase)/1000)}:{cost:price,seconds:0}}
let receiptTimer,audio;
function chime(which){
 if(!state.sound)return;
 try{
   audio??=new (window.AudioContext||window.webkitAudioContext)();
   if(audio.state==='suspended')audio.resume().catch(()=>{});
   const notes={buy:[784,1047],work:[294,440],bonus:[523,659,784,1047],upgrade:[392,494,587,784],sell:[659,494],pack:[330],error:[175,147]};
   notes[which].forEach((f,i)=>{
     const t=audio.currentTime+i*.085,o=audio.createOscillator(),g=audio.createGain();
     o.type=which==='work'?'triangle':'sine';o.frequency.value=f;
     g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+.24);
     o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.25);o.onended=()=>{o.disconnect();g.disconnect()};
   });
 }catch{}
}
function notice(msg,type='info',canOpen=false){
 clearTimeout(receiptTimer);$('receipt').hidden=false;$('receipt').className=type;
 $('notice').textContent=msg;$('pack').hidden=!canOpen;
 if(type==='error')chime('error');
 receiptTimer=setTimeout(()=>{$('receipt').hidden=true},type==='bonus'?12000:6500);
}
function motion(el,frames,ms){
 if(el.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)return el.animate(frames,{duration:ms,easing:'ease-out'});
}
function fly(i){
 const source=cards[i].button.closest('article').querySelector('.icon'),target=$('storage');
 const a=source.getBoundingClientRect(),b=target.getBoundingClientRect();
 if(matchMedia('(prefers-reduced-motion: reduce)').matches||!source.animate)return;
 const ghost=document.createElement('span');ghost.className='parcel';ghost.textContent=rows[i][0];ghost.setAttribute('aria-hidden','true');
 const x=Math.min(innerWidth-36,Math.max(0,a.left)),y=Math.max(b.bottom,Math.min(innerHeight-40,a.top));
 ghost.style.left=x+'px';ghost.style.top=y+'px';document.body.append(ghost);
 const anim=ghost.animate([{transform:'scale(1)'},{transform:'translate('+ (b.left+b.width/2-x)+'px,'+(b.top-y)+'px) scale(.35)',opacity:.2}],{duration:540,easing:'ease-in'});
 anim.onfinish=()=>ghost.remove();anim.oncancel=()=>ghost.remove();
}
function buy(i){const q=quote(i,Date.now()),regular=rows[i][2];
 if(q.cost!==Number(cards[i].button.dataset.price)){prices();notice('The price changed. Check the new price before buying.');return}
 if(used()+size(i)>tiers[state.tier][1])return notice('Needs '+size(i)+' slots. Sell an item or upgrade your storage.','error',true);
 if(q.cost>state.cash)return notice('Need $'+(q.cost-state.cash)+' more. Work earns $'+jobs[state.job][1]+' per shift.','error');
 state.cash-=q.cost;state.spent+=q.cost;state.bag.push({id:i,paid:q.cost});
 let msg=rows[i][0]+' '+rows[i][1]+' packed · −$'+q.cost+'.'+(q.seconds?' You saved $'+(regular-q.cost)+'!':'');
 const group=Math.floor(i/3);let bonus=0;
 if(!state.sets.includes(group)&&[0,1,2].every(k=>state.bag.some(x=>x.id===group*3+k))){
 state.sets.push(group);bonus=creditSet(group);msg+=' '+collections[group]+' complete! +$'+bonus+' bonus.'}
 save();render();fly(i);chime(bonus?'bonus':'buy');notice(msg,bonus?'bonus':'purchase',true);
 motion(cards[i].button,[{transform:'scale(.94)'},{transform:'scale(1)'}],280)}
const cards=rows.map(([icon,name],i)=>{const el=document.createElement('article');
 el.innerHTML='<span class="icon" aria-hidden="true">'+icon+'</span><h3>'+name+'</h3><small>'+size(i)+' storage slot'+(size(i)>1?'s':'')+' · '+collections[Math.floor(i/3)]+'</small><span></span><button class="buy"></button>';
 const button=el.lastElementChild;button.onclick=()=>buy(i);$('items').append(el);
 return {button,label:button.previousElementSibling}});
function prices(){const now=Date.now();cards.forEach(({button,label},i)=>{const q=quote(i,now);button.dataset.price=q.cost;button.textContent='Buy · $'+q.cost;
 label.className=q.seconds?'sale':'';label.textContent=q.seconds?'Was $'+rows[i][2]+' · '+q.seconds+'s left':'Regular price'})}
function discard(index,sell){const x=state.bag[index],value=sell?Math.floor(x.paid/2):0;state.bag.splice(index,1);state.cash+=value;save();render();notice(sell?'Sold '+rows[x.id][1]+' for $'+value+'.':'Tossed '+rows[x.id][1]+'.')}
function render(){const [tier,cap]=tiers[state.tier];$('wallet').textContent='$'+state.cash;$('score').textContent='$'+state.spent;$('space').textContent=tier+' '+used()+'/'+cap;
 $('tier').textContent='Your '+tier.toLowerCase();const next=tiers[state.tier+1];$('upgrade').replaceChildren();
 if(next){const b=document.createElement('button');b.textContent='Upgrade to '+next[0]+' · '+next[1]+' slots · $'+next[2];b.onclick=()=>{if(state.cash<next[2])return notice('Earn $'+(next[2]-state.cash)+' more to upgrade.');state.cash-=next[2];state.spent+=next[2];state.tier++;save();render();chime('upgrade');notice('Moved into the '+next[0].toLowerCase()+'!')};$('upgrade').append(b)}
 $('case').dataset.tier=state.tier;$('caseLabel').textContent=tier+' · '+used()+' / '+cap+' slots';
 $('stock').replaceChildren();
 state.bag.forEach((item,index)=>{
   const [icon,name]=rows[item.id],tile=document.createElement('button');
   tile.className='packed';tile.style.gridColumn='span '+size(item.id);
   tile.innerHTML='<span aria-hidden="true">'+icon+'</span><small>'+name+'</small>';
   tile.setAttribute('aria-label','Inspect '+name);tile.onclick=()=>inspect(index);$('stock').append(tile);
 });
 for(let n=used();n<cap;n++){
   const slot=document.createElement('div');slot.className='vacant';slot.setAttribute('aria-hidden','true');$('stock').append(slot);
 }
 $('sets').replaceChildren(...collections.map((name,g)=>{
   const el=document.createElement('p'),done=state.sets.includes(g),group=rows.slice(g*3,g*3+3);
   const count=group.filter((_,j)=>state.bag.some(x=>x.id===g*3+j)).length;
   const label=document.createElement('strong');label.textContent=(done?'✓ ':'')+name+' · '+(done?'$'+reward(g)+' awarded':count+'/3 · +$'+reward(g));
   const list=document.createElement('small');list.textContent=group.map(r=>r[1]).join(' · ');el.append(label,list);return el;
 }));
 $('work').textContent='Work +$'+jobs[state.job][1];$('sound').textContent=state.sound?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',state.sound);prices()}
function inspect(index){
 const item=state.bag[index],[icon,name]=rows[item.id];$('detailIcon').textContent=icon;$('itemTitle').textContent=name;
 $('itemInfo').textContent='Paid $'+item.paid+' · '+size(item.id)+' storage slot'+(size(item.id)>1?'s':'');
 $('sellItem').textContent='Sell · $'+Math.floor(item.paid/2);
 for(const [id,sell] of [['sellItem',true],['tossItem',false]]){
   $(id).onclick=()=>{$('itemDialog').close();discard(index,sell);chime(sell?'sell':'pack')};
 }
 $('itemDialog').showModal();chime('pack');
}
$('keepItem').onclick=()=>$('itemDialog').close();
function paintJobs(){
 const next=jobs[state.job+1];$('jobInfo').textContent=jobs[state.job][0]+' · $'+jobs[state.job][1]+' per tap · Wallet $'+state.cash;
 $('jobs').replaceChildren(...jobs.map(([name,pay,cost],i)=>{
   const row=document.createElement('p');row.className=i===state.job?'current':'';
   row.textContent=name+' · $'+pay+'/shift'+(i===state.job?' · Current':i>state.job?' · $'+cost+' upgrade':' · Completed');return row;
 }));
 $('promote').hidden=!next;if(next)$('promote').textContent='Upgrade · $'+next[2];
}
$('career').onclick=()=>{paintJobs();$('jobMessage').textContent='';$('jobDialog').showModal()};
$('closeJob').onclick=()=>$('jobDialog').close();
$('promote').onclick=()=>{
 const next=jobs[state.job+1];if(!next)return;
 if(state.cash<next[2]){$('jobMessage').textContent='Earn $'+(next[2]-state.cash)+' more for this upgrade.';chime('error');return}
 state.cash-=next[2];state.spent+=next[2];state.job++;save();render();paintJobs();chime('upgrade');$('jobMessage').textContent='Promoted! Each shift now pays $'+next[1]+'.';
};
$('sound').onclick=()=>{state.sound=!state.sound;save();render();chime('buy')};
$('pack').onclick=()=>{tab(true);$('receipt').hidden=true;chime('pack')};
function tab(storage){$('bin').hidden=!storage;$('store').hidden=storage;$('storage').setAttribute('aria-pressed',storage);$('shop').setAttribute('aria-pressed',!storage);window.scrollTo(0,0)}
$('shop').onclick=()=>tab(false);$('storage').onclick=()=>tab(true);$('work').onclick=()=>{const pay=jobs[state.job][1];state.cash+=pay;save();render();chime('work');motion($('work'),[{transform:'translateY(2px)'},{transform:'translateY(-3px)'},{transform:'none'}],240);notice(jobs[state.job][0]+' shift · +$'+pay+' earned.')};
$('restart').onclick=()=>$('confirm').showModal();$('cancel').onclick=()=>$('confirm').close();$('reset').onclick=()=>{state=fresh();save();render();tab(false);notice('Fresh start!');$('confirm').close()};
tab(false);render();if(backPay){save();notice('Collection rewards from your saved game: +$'+backPay+'.','bonus')}setInterval(prices,500);
</script></html>
